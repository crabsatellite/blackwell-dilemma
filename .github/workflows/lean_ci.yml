name: Lean CI

on:
  push:
    branches: [master]
    paths:
      - 'lean4/**'
      - 'paper/current_theory_map.json'
      - 'CITATION.cff'
      - 'LICENSE'
      - '.github/workflows/lean_ci.yml'
  pull_request:
    paths:
      - 'lean4/**'
      - 'paper/current_theory_map.json'
      - 'CITATION.cff'
      - 'LICENSE'
      - '.github/workflows/lean_ci.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lean4
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install elan
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh && \
               sh /tmp/elan-init.sh -y --default-toolchain none; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache Mathlib
        uses: actions/cache@v6
        timeout-minutes: 10
        continue-on-error: true
        with:
          path: lean4/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean4/lean-toolchain', 'lean4/lakefile.toml', 'lean4/lake-manifest.json') }}
          restore-keys: lake-${{ runner.os }}-

      - name: Get Mathlib cache
        run: timeout 15m lake exe cache get || true

      - name: Verify current-paper theory map and trust boundary
        run: python verify_release.py
