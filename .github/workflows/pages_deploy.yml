name: Pages Deploy

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - '.github/workflows/pages_deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prepare Pages artifact
        run: |
          test -f docs/index.html
          tar --dereference --hard-dereference --directory docs -cvf "$RUNNER_TEMP/artifact.tar" .
          gzip --best "$RUNNER_TEMP/artifact.tar"

      - name: Upload Pages artifact
        uses: actions/upload-artifact@v6
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar.gz
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
