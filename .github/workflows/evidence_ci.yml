name: Public Evidence Gate

on:
  push:
    branches: [master]
    paths:
      - 'README.md'
      - 'prediction_status.md'
      - 'tracker.py'
      - 'verification/**'
      - 'docs/**'
      - 'results/**'
      - 'reference-evidence/**'
      - 'tools/verify_public_evidence.py'
      - 'lean4/**'
      - '.github/workflows/evidence_ci.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'prediction_status.md'
      - 'tracker.py'
      - 'verification/**'
      - 'docs/**'
      - 'results/**'
      - 'reference-evidence/**'
      - 'tools/verify_public_evidence.py'
      - 'lean4/**'
      - '.github/workflows/evidence_ci.yml'
  workflow_dispatch:

jobs:
  public-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install elan
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh && \
               sh /tmp/elan-init.sh -y --default-toolchain none; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache Mathlib
        uses: actions/cache@v6
        timeout-minutes: 10
        continue-on-error: true
        with:
          path: lean4/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean4/lean-toolchain', 'lean4/lakefile.toml', 'lean4/lake-manifest.json') }}
          restore-keys: lake-${{ runner.os }}-

      - name: Get Mathlib cache
        working-directory: lean4
        run: timeout 15m lake exe cache get || true

      - name: Build AxiomAudit dependency surface
        working-directory: lean4
        run: lake build BlackwellDilemma.AxiomAudit

      - name: Verify public evidence manifest
        run: python tools/verify_public_evidence.py

      - name: Verify generated research reports
        run: |
          python tracker.py --check-report
          python verification/render_live_prediction_report.py --check

      - name: Audit documentation surface
        run: python tools/audit_documentation_surface.py
