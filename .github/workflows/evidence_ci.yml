name: Public Evidence Gate

on:
  push:
    branches: [master]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'results/**'
      - 'reference-evidence/**'
      - 'tools/verify_public_evidence.py'
      - 'lean4/BlackwellDilemma/PaperSemanticGate.lean'
      - '.github/workflows/evidence_ci.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'results/**'
      - 'reference-evidence/**'
      - 'tools/verify_public_evidence.py'
      - 'lean4/BlackwellDilemma/PaperSemanticGate.lean'
      - '.github/workflows/evidence_ci.yml'
  workflow_dispatch:

jobs:
  public-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify public evidence manifest
        run: python tools/verify_public_evidence.py
